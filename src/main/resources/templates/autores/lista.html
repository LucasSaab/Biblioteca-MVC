<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Autores')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}" th:with="ativo='autores'"></header>

<main id="conteudo" class="container">
    <section class="ficha ficha-enter">
        <div class="ficha-head">
            <div>
                <h1 class="ficha-title">Autores</h1>
                <p class="ficha-meta">Total de autores: <strong th:text="${autores.size()}">0</strong></p>
            </div>
            <a class="btn btn-primary" th:href="@{/autores/novo}">Cadastrar autor</a>
        </div>

        <div class="ficha-body" th:if="${#lists.isEmpty(autores)}">
            <div class="empty-state">
                <p class="empty-title">Nenhum autor cadastrado ainda.</p>
                <p class="empty-text">Use o botão Cadastrar autor para incluir o primeiro.</p>
            </div>
        </div>

        <div class="ficha-body ficha-body-flush" th:unless="${#lists.isEmpty(autores)}">
            <div class="table-wrapper">
                <table class="table">
                    <caption class="sr-only">Autores cadastrados</caption>
                    <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Nacionalidade</th>
                        <th scope="col" class="th-actions">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="autor : ${autores}">
                        <td data-label="Nome" class="cell-title" th:text="${autor.nome}"></td>
                        <td data-label="Nacionalidade" th:text="${autor.nacionalidade ?: '—'}"></td>
                        <td class="cell-actions">
                            <a class="btn btn-secondary btn-sm" th:href="@{/autores/editar/{id}(id=${autor.id})}"
                               th:attr="aria-label=|Editar ${autor.nome}|">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/autores/excluir/{id}(id=${autor.id})}"
                               th:attr="aria-label=|Excluir ${autor.nome}|"
                               onclick="return confirm('Tem certeza que deseja excluir este autor?');">Excluir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
