<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{biblioteca/fragmentos :: cabecalho('Livros')}"></head>
<body>
<nav th:replace="~{biblioteca/fragmentos :: menu}"></nav>
<main>
    <h1>Livros</h1>
    <a class="btn" th:href="@{/livros}">Novo livro</a>

    <p class="ok" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <p class="vazio" th:if="${#lists.isEmpty(livros)}">Nenhum livro cadastrado.</p>

    <table th:unless="${#lists.isEmpty(livros)}">
        <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ano</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${livros}">
            <td th:text="${l.titulo}"></td>
            <td th:text="${l.autor}"></td>
            <td th:text="${l.isbn}"></td>
            <td th:text="${l.anoPublicacao}"></td>
            <td>
                <a class="btn btn-sec" th:href="@{/livros/editar/{id}(id=${l.id})}">Editar</a>
                <form th:action="@{/livros/excluir/{id}(id=${l.id})}" method="post"
                      onsubmit="return confirm('Excluir este livro?');">
                    <button type="submit" class="btn-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
