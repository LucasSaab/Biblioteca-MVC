<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Biblioteca'">Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        nav { background: #1f3a5f; padding: 12px 24px; }
        nav a { color: #fff; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .botoes { margin-top: 20px; }
        button, .btn { display: inline-block; padding: 8px 16px; border: 0; border-radius: 4px; background: #1f3a5f;
                       color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn-sec { background: #6b7280; }
        .btn-perigo { background: #b91c1c; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        td form { display: inline; }
        .ok { background: #dcfce7; color: #166534; padding: 10px; border-radius: 4px; }
        .erro { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 4px; }
        .vazio { color: #666; }
    </style>
</head>
<body>
<nav th:fragment="menu">
    <a th:href="@{/inicio}">Início</a>
    <a th:href="@{/livros/lista}">Livros</a>
    <a th:href="@{/autores/lista}">Autores</a>
    <a th:href="@{/categorias/lista}">Categorias</a>
</nav>
</body>
</html>
