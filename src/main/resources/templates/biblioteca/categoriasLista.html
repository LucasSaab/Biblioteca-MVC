<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{biblioteca/fragmentos :: cabecalho('Categorias')}"></head>
<body>
<nav th:replace="~{biblioteca/fragmentos :: menu}"></nav>
<main>
    <h1>Categorias</h1>
    <a class="btn" th:href="@{/categorias}">Nova categoria</a>

    <p class="ok" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <p class="vazio" th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>

    <table th:unless="${#lists.isEmpty(categorias)}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.nome}"></td>
            <td>
                <a class="btn btn-sec" th:href="@{/categorias/editar/{id}(id=${c.id})}">Editar</a>
                <form th:action="@{/categorias/excluir/{id}(id=${c.id})}" method="post"
                      onsubmit="return confirm('Excluir esta categoria?');">
                    <button type="submit" class="btn-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
