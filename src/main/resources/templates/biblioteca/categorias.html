<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{biblioteca/fragmentos :: cabecalho('Categoria')}"></head>
<body>
<nav th:replace="~{biblioteca/fragmentos :: menu}"></nav>
<main>
    <h1 th:text="${categoria.id == null} ? 'Nova categoria' : 'Editar categoria'">Nova categoria</h1>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <form th:action="@{/categorias}" th:object="${categoria}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}">

        <div class="botoes">
            <button type="submit" th:text="${categoria.id == null} ? 'Cadastrar' : 'Salvar alterações'">Cadastrar</button>
            <a class="btn btn-sec" th:href="@{/categorias/lista}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
