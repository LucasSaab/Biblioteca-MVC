<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main>
    <h1>Cadastrar Livro</h1>
    <form th:action="@{/livros}" th:object="${livro}" method="post">
        <p>
            <label>Título:</label>
            <input type="text" th:field="*{titulo}" required />
        </p>
        <p>
            <label>Autor:</label>
            <input type="text" th:field="*{autor}" required />
        </p>
        <p>
            <label>ISBN:</label>
            <input type="text" th:field="*{isbn}" required />
        </p>
        <p>
            <label>Ano de Publicação:</label>
            <input type="number" th:field="*{anoPublicacao}" required />
        </p>
        <button type="submit">Cadastrar</button>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
