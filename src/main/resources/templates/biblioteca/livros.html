<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{biblioteca/fragmentos :: cabecalho('Livro')}"></head>
<body>
<nav th:replace="~{biblioteca/fragmentos :: menu}"></nav>
<main>
    <h1 th:text="${livro.id == null} ? 'Novo livro' : 'Editar livro'">Novo livro</h1>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <form th:action="@{/livros}" th:object="${livro}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="titulo">Título</label>
        <input type="text" id="titulo" th:field="*{titulo}">

        <label for="autor">Autor</label>
        <input type="text" id="autor" th:field="*{autor}">

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}">

        <label for="anoPublicacao">Ano de publicação</label>
        <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}">

        <div class="botoes">
            <button type="submit" th:text="${livro.id == null} ? 'Cadastrar' : 'Salvar alterações'">Cadastrar</button>
            <a class="btn btn-sec" th:href="@{/livros/lista}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
