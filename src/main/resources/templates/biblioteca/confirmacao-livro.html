<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Livro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main>
    <h1>Livro Cadastrado com Sucesso!</h1>

    <p><strong>Título:</strong> <span th:text="${livro.titulo}"></span></p>
    <p><strong>Autor:</strong> <span th:text="${livro.autor}"></span></p>
    <p><strong>ISBN:</strong> <span th:text="${livro.isbn}"></span></p>
    <p><strong>Ano de Publicação:</strong> <span th:text="${livro.anoPublicacao}"></span></p>

    <a th:href="@{/livros}">Voltar para o cadastro de livros</a>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
