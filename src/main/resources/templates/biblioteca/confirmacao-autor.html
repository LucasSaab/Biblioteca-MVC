<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Autor</title>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<h1>Autor Cadastrado com Sucesso!</h1>

<p>Nome: <span th:text="${autor.nome}"></span></p>
<p>Nacionalidade: <span th:text="${autor.nacionalidade}"></span></p>

<a th:href="@{/autores}">Voltar para o cadastro</a>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
