<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{biblioteca/fragmentos :: cabecalho('Autores')}"></head>
<body>
<nav th:replace="~{biblioteca/fragmentos :: menu}"></nav>
<main>
    <h1>Autores</h1>
    <a class="btn" th:href="@{/autores}">Novo autor</a>

    <p class="ok" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <p class="vazio" th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado.</p>

    <table th:unless="${#lists.isEmpty(autores)}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Nacionalidade</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${autores}">
            <td th:text="${a.nome}"></td>
            <td th:text="${a.nacionalidade}"></td>
            <td>
                <a class="btn btn-sec" th:href="@{/autores/editar/{id}(id=${a.id})}">Editar</a>
                <form th:action="@{/autores/excluir/{id}(id=${a.id})}" method="post"
                      onsubmit="return confirm('Excluir este autor?');">
                    <button type="submit" class="btn-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
