<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{biblioteca/fragmentos :: cabecalho('Autor')}"></head>
<body>
<nav th:replace="~{biblioteca/fragmentos :: menu}"></nav>
<main>
    <h1 th:text="${autor.id == null} ? 'Novo autor' : 'Editar autor'">Novo autor</h1>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <form th:action="@{/autores}" th:object="${autor}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}">

        <label for="nacionalidade">Nacionalidade</label>
        <input type="text" id="nacionalidade" th:field="*{nacionalidade}">

        <div class="botoes">
            <button type="submit" th:text="${autor.id == null} ? 'Cadastrar' : 'Salvar alterações'">Cadastrar</button>
            <a class="btn btn-sec" th:href="@{/autores/lista}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
