<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<h1 th:text="Livros"></h1>
<form th:action="@{/autores}" th:object="${autor}" method="post">
    <p>
        <label>Nome do autor:</label>
        <input type="text" th:field="*{nome}" />
    </p>
    <p>
        <label>Nacionalidade do autor:</label>
        <input type="text" th:field="*{nacionalidade}" />
    </p>
    <p>
        <label>Livros publicados:</label>
        <input type="text" th:field="*{livrosPublicados}" />
    </p>
    <button type="submit">Cadastrar</button>
</form>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
