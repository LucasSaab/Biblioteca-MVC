<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoria')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}" th:with="ativo='categorias'"></header>

<main id="conteudo" class="container container-narrow">
    <section class="ficha ficha-form ficha-enter">
        <div class="ficha-head">
            <h1 class="ficha-title" th:text="${categoria.id == null} ? 'Cadastrar categoria' : 'Editar categoria'">Cadastrar categoria</h1>
        </div>

        <div class="ficha-body">
            <form class="form" th:object="${categoria}" action="/categorias" method="post">
                <!-- id vazio = cadastro (insert); id preenchido = edição (update) -->
                <input type="hidden" th:field="*{id}">

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" required>
                </div>

                <div class="form-actions">
                    <a class="btn btn-ghost" th:href="@{/categorias}">Cancelar</a>
                    <button type="submit" class="btn btn-primary"
                            th:text="${categoria.id == null} ? 'Cadastrar categoria' : 'Salvar alterações'">Cadastrar categoria</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
