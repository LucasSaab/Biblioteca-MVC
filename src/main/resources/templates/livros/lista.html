<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Livros')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}" th:with="ativo='livros'"></header>

<main id="conteudo" class="container">
    <section class="ficha ficha-enter">
        <div class="ficha-head">
            <div>
                <h1 class="ficha-title">Livros</h1>
                <p class="ficha-meta">Total de livros: <strong th:text="${livros.size()}">0</strong></p>
            </div>
            <a class="btn btn-primary" th:href="@{/livros/novo}">Cadastrar livro</a>
        </div>

        <div class="ficha-body" th:if="${#lists.isEmpty(livros)}">
            <div class="empty-state">
                <p class="empty-title">Nenhum livro cadastrado ainda.</p>
                <p class="empty-text">Use o botão Cadastrar livro para incluir o primeiro.</p>
            </div>
        </div>

        <div class="ficha-body ficha-body-flush" th:unless="${#lists.isEmpty(livros)}">
            <div class="table-wrapper">
                <table class="table">
                    <caption class="sr-only">Livros cadastrados</caption>
                    <thead>
                    <tr>
                        <th scope="col">Título</th>
                        <th scope="col">Autor</th>
                        <th scope="col">ISBN</th>
                        <th scope="col">Ano</th>
                        <th scope="col" class="th-actions">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="livro : ${livros}">
                        <td data-label="Título" class="cell-title" th:text="${livro.titulo}"></td>
                        <td data-label="Autor" th:text="${livro.autor ?: '—'}"></td>
                        <td data-label="ISBN" th:text="${livro.isbn ?: '—'}"></td>
                        <td data-label="Ano" th:text="${livro.anoPublicacao ?: '—'}"></td>
                        <td class="cell-actions">
                            <a class="btn btn-secondary btn-sm" th:href="@{/livros/editar/{id}(id=${livro.id})}"
                               th:attr="aria-label=|Editar ${livro.titulo}|">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/livros/excluir/{id}(id=${livro.id})}"
                               th:attr="aria-label=|Excluir ${livro.titulo}|"
                               onclick="return confirm('Tem certeza que deseja excluir este livro?');">Excluir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
