<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livro - Sistema de Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
</nav>
<main>
    <h1 th:text="${livro.id == null} ? 'Cadastrar Livro' : 'Editar Livro'">Cadastrar Livro</h1>

    <form th:object="${livro}" action="/livros" method="post">
        <!-- id vazio = cadastro (insert); id preenchido = edição (update) -->
        <input type="hidden" th:field="*{id}">

        <label>Título:</label>
        <input type="text" th:field="*{titulo}">

        <label>Autor:</label>
        <input type="text" th:field="*{autor}">

        <label>ISBN:</label>
        <input type="text" th:field="*{isbn}">

        <label>Ano de publicação:</label>
        <input type="number" th:field="*{anoPublicacao}">

        <div class="botoes">
            <button type="submit">Salvar</button>
            <a class="btn btn-sec" th:href="@{/livros}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
