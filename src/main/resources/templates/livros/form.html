<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Livro')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}" th:with="ativo='livros'"></header>

<main id="conteudo" class="container container-narrow">
    <section class="ficha ficha-form ficha-enter">
        <div class="ficha-head">
            <h1 class="ficha-title" th:text="${livro.id == null} ? 'Cadastrar livro' : 'Editar livro'">Cadastrar livro</h1>
        </div>

        <div class="ficha-body">
            <form class="form" th:object="${livro}" action="/livros" method="post">
                <!-- id vazio = cadastro (insert); id preenchido = edição (update) -->
                <input type="hidden" th:field="*{id}">

                <div class="field">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" th:field="*{titulo}" required>
                </div>

                <div class="field">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" th:field="*{autor}">
                </div>

                <div class="form-row">
                    <div class="field">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" th:field="*{isbn}">
                    </div>
                    <div class="field">
                        <label for="anoPublicacao">Ano de publicação</label>
                        <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}">
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-ghost" th:href="@{/livros}">Cancelar</a>
                    <button type="submit" class="btn btn-primary"
                            th:text="${livro.id == null} ? 'Cadastrar livro' : 'Salvar alterações'">Cadastrar livro</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
